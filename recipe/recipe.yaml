schema_version: 1

context:
  version: "1.1.3"
  python_min: "3.11"

package:
  name: dailyerosion
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dailyerosion/dailyerosion-${{ version }}.tar.gz
  sha256: 5e007ec80023b5e6363596824f4b7009e6cea6a3407248707b00be0adea61c25

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - gdal >=3.10
    - httpx
    - numpy
    - pandas
    - pika
    - pydantic
    - pyiem >=1.25.0
    - rasterio
    - scipy
    - sqlalchemy
    - tqdm

tests:
  - python:
      imports:
        - dailyerosion
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Daily Erosion Project Python package
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/dailyerosion/dep

extra:
  recipe-maintainers:
    - akrherz
